<app-header></app-header>

<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user (select)="onSelectUser($event)" [user]="user" />
      </li>
    } @empty {
      <li>No users found.</li>
    }
  </ul>

  <app-tasks [name]="selectedUser?.name"></app-tasks>
</main>
